<!DOCTYPE html>
<html>
<head>
    <title>Max Button Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .pass { background: #d4edda; }
        .fail { background: #f8d7da; }
        input, button { padding: 8px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Max Button Functionality Test</h1>
    
    <div class="test">
        <h2>Buy Panel</h2>
        <label>Shares to Buy:</label>
        <div>
            <input type="number" id="buy_shares" placeholder="Enter shares" value="">
            <button id="maxBuyBtn">Max</button>
        </div>
        <p>Max Shares: <span id="maxShares">0</span></p>
        <div id="buyResultDiv" style="margin-top: 10px;"></div>
    </div>

    <div class="test">
        <h2>Sell Panel</h2>
        <label>Shares to Sell:</label>
        <div>
            <input type="number" id="sell_shares" placeholder="Enter shares" value="">
            <button id="maxSellBtn">Max</button>
        </div>
        <div id="sellResultDiv" style="margin-top: 10px;"></div>
    </div>

    <h2>Console Output</h2>
    <pre id="console" style="background: #f5f5f5; padding: 10px; height: 300px; overflow-y: auto; border: 1px solid #ccc;"></pre>

    <script>
        // Capture console.log output
        const consoleLogs = [];
        const originalLog = console.log;
        console.log = function(...args) {
            const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : String(arg)).join(' ');
            consoleLogs.push(message);
            document.getElementById('console').textContent = consoleLogs.join('\n');
            originalLog.apply(console, args);
        };

        // Trading Page JavaScript
        console.log('Trade script starting to load...');
        
        const STOCK_PRICE = 100;
        const USER_CASH = 5000;
        const USER_SHARES = 10;
        
        console.log('Constants loaded - STOCK_PRICE:', STOCK_PRICE, 'USER_CASH:', USER_CASH, 'USER_SHARES:', USER_SHARES);

        function calculateMaxShares() {
            if (USER_CASH > 0 && STOCK_PRICE > 0) {
                return Math.floor(USER_CASH / STOCK_PRICE);
            }
            return 0;
        }

        function updateBuyCalculations() {
            const shareInput = document.getElementById('buy_shares');
            const shares = parseInt(shareInput.value) || 0;
            const totalCost = shares * STOCK_PRICE;
            const cashAfter = USER_CASH - totalCost;
            const resultDiv = document.getElementById('buyResultDiv');
            resultDiv.innerHTML = `<strong>Total Cost:</strong> $${totalCost.toFixed(2)}<br><strong>Cash After:</strong> $${cashAfter.toFixed(2)}`;
        }

        function updateSellCalculations() {
            const shareInput = document.getElementById('sell_shares');
            const shares = parseInt(shareInput.value) || 0;
            const totalProceeds = shares * STOCK_PRICE;
            const cashAfter = USER_CASH + totalProceeds;
            const resultDiv = document.getElementById('sellResultDiv');
            resultDiv.innerHTML = `<strong>Total Proceeds:</strong> $${totalProceeds.toFixed(2)}<br><strong>Cash After:</strong> $${cashAfter.toFixed(2)}`;
        }

        function handleMaxBuyClick(e) {
            console.log('Max buy button clicked!');
            e.preventDefault();
            e.stopPropagation();
            const buySharesInput = document.getElementById('buy_shares');
            const max = calculateMaxShares();
            console.log('Calculated max:', max);
            if (max > 0 && buySharesInput) {
                console.log('Setting shares to:', max);
                buySharesInput.value = max;
                buySharesInput.dispatchEvent(new Event('input', { bubbles: true }));
                updateBuyCalculations();
                buySharesInput.focus();
            } else {
                alert('Insufficient funds to purchase any shares of this stock.');
            }
        }

        function handleMaxSellClick(e) {
            console.log('Max sell button clicked!');
            e.preventDefault();
            e.stopPropagation();
            const sellSharesInput = document.getElementById('sell_shares');
            if (USER_SHARES > 0 && sellSharesInput) {
                console.log('Setting sell shares to:', USER_SHARES);
                sellSharesInput.value = USER_SHARES;
                sellSharesInput.dispatchEvent(new Event('input', { bubbles: true }));
                updateSellCalculations();
                sellSharesInput.focus();
            } else {
                alert('You don\'t own any shares of this stock.');
            }
        }

        // Initialize on page load
        console.log('Setting up DOMContentLoaded listener...');
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOMContentLoaded fired!');
            // Get form elements
            const buySharesInput = document.getElementById('buy_shares');
            const maxBuyBtn = document.getElementById('maxBuyBtn');
            const sellSharesInput = document.getElementById('sell_shares');
            const maxSellBtn = document.getElementById('maxSellBtn');

            console.log('Elements found - buy_shares:', !!buySharesInput, 'maxBuyBtn:', !!maxBuyBtn, 'sell_shares:', !!sellSharesInput, 'maxSellBtn:', !!maxSellBtn);

            // Update max shares display
            const maxShares = calculateMaxShares();
            console.log('Calculated max shares:', maxShares);
            if (document.getElementById('maxShares')) {
                document.getElementById('maxShares').textContent = maxShares.toLocaleString();
            }
            if (buySharesInput) {
                buySharesInput.setAttribute('max', maxShares);
            }

            // Buy input event listener
            if (buySharesInput) {
                buySharesInput.addEventListener('input', updateBuyCalculations);
                console.log('Added input listener to buy_shares');
            }

            // Max Buy button click handler
            if (maxBuyBtn) {
                console.log('Attaching click handler to maxBuyBtn');
                maxBuyBtn.addEventListener('click', handleMaxBuyClick);
                console.log('Click handler attached to maxBuyBtn');
            } else {
                console.error('maxBuyBtn element not found!');
            }

            // Sell input event listener
            if (sellSharesInput) {
                sellSharesInput.addEventListener('input', updateSellCalculations);
                console.log('Added input listener to sell_shares');
            }

            // Max Sell button click handler
            if (maxSellBtn) {
                console.log('Attaching click handler to maxSellBtn');
                maxSellBtn.addEventListener('click', handleMaxSellClick);
                console.log('Click handler attached to maxSellBtn');
            }
        });

        // Also try immediate attachment (in case DOMContentLoaded already fired)
        console.log('Attempting immediate button attachment...');
        setTimeout(function() {
            const maxBuyBtn = document.getElementById('maxBuyBtn');
            const maxSellBtn = document.getElementById('maxSellBtn');
            console.log('After timeout - maxBuyBtn:', !!maxBuyBtn, 'maxSellBtn:', !!maxSellBtn);
            if (maxBuyBtn && !maxBuyBtn._listener_attached) {
                console.log('Attaching click handler to maxBuyBtn (timeout)');
                maxBuyBtn.addEventListener('click', handleMaxBuyClick);
                maxBuyBtn._listener_attached = true;
            }
            if (maxSellBtn && !maxSellBtn._listener_attached) {
                console.log('Attaching click handler to maxSellBtn (timeout)');
                maxSellBtn.addEventListener('click', handleMaxSellClick);
                maxSellBtn._listener_attached = true;
            }
        }, 100);
    </script>
</body>
</html>
